<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users | SPARC</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-background">
    <!--  NAVBAR -->
    <header>
        <div class="container navbar">
            <div class="logo-area">
                <div class="logo-circle">S</div>
                <h2 class="logo-title">SPARC</h2>
            </div>

            <button class="primary-btn"
                onclick="window.location.href='dashboard.html'">
                ← Back to Dashboard
            </button>
        </div>
    </header>

    <!-- MANAGE USERS SECTION -->
    <section class="section-padding">
        <div class="container">
            <h1 class="section-title">
                👥 Manage Users
            </h1>

            <p class="section-subtitle; color:mediumvioletred;">
                View, search and manage all registered users.
            </p>

            <br><br>

            <!-- USER STATISTICS -->
            <div class="manage-user-stats">

                <div class="summary-card clickable-card"
                    data-role="All"
                    onclick="loadAllUsers()">
                    <h3>👥</h3>
                    <p>Total Users</p>
                    <h2 id="totalUsers">0</h2>
                </div>

                <div class="summary-card clickable-card"
                    data-role="Volunteer"
                    onclick="loadUsersByRole('Volunteer')">
                    <h3>🤝</h3>
                    <p>Volunteers</p>
                    <h2 id="volunteerCount">0</h2>
                </div>

                <div class="summary-card clickable-card"
                    data-role="NGO"
                    onclick="loadUsersByRole('NGO')">
                    <h3>🏢</h3>
                    <p>NGOs</p>
                    <h2 id="ngoCount">0</h2>
                </div>

                <div class="summary-card clickable-card"
                    data-role="Donor"
                    onclick="loadUsersByRole('Donor')">
                    <h3>🍱</h3>
                    <p>Donors</p>
                    <h2 id="donorCount">0</h2>
                </div>

                <div class="summary-card clickable-card"
                    data-role="Employer"
                    onclick="loadUsersByRole('Employer')">
                    <h3>💼</h3>
                    <p>Employers</p>
                    <h2 id="employerCount">0</h2>
                </div>
            </div>

            <br><br>

            <!-- SEARCH BOX -->
            <div class="user-search-bar">
                <input
                    type="text"
                    id="userSearch"
                    placeholder="🔍 Search users by name or email">

                <div class="status-filter">
                    <button
                        class="primary-btn"
                        id="allBtn"
                        onclick="filterByStatus('All')">

                        All
                    </button>

                    <button
                        class="primary-btn"
                        id="activeBtn"
                        onclick="filterByStatus('Active')">

                        Active
                    </button>

                    <button
                        class="primary-btn"
                        id="inactiveBtn"
                        onclick="filterByStatus('Inactive')">

                        Inactive
                    </button>
                </div>
            </div>

            <br><br>

            <!-- USERS TABLE -->
            <div id="usersTableContainer">
                <div class="dashboard-actions">
                    <p style="text-align:center;">
                        Select a role to load users.
                    </p>
                </div>
            </div>

            <br>

            <!-- PAGINATION -->
            <div id="pagination"></div>

        </div>
    </section>

    <script src="config.js"></script>
    <script src="manage-users.js"></script>

</body>
</html>

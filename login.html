<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SPARC Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Paste the Login Modal here -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <span class="close-btn" style="display:none;">
                ✕
            </span>
            <h2>SPARC Login</h2>

            <form id="loginForm">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <div class="forgot-password">
                    <a href="#" onclick="openForgotPassword(); return false;">
                        Forgot Password?
                    </a>
                </div>

                <div
                    style="
                    margin:15px 0;
                    display:flex;
                    align-items:center;
                    gap:8px;
                ">

                    <input
                        type="checkbox"
                        id="rememberMe"
                        style="
                        width:18px;
                        height:18px;
                        cursor:pointer;
                    ">

                    <label
                        for="rememberMe"
                        style="
                        margin:0;
                        cursor:pointer;
                        font-weight:500;
                    ">
                        Keep me signed in on this device
                    </label>
                </div>

                <label>Role</label>
                <select id="role">

                    <option>Volunteer</option>
                    <option>NGO</option>
                    <option>Donor</option>
                    <option>Employer</option>
                    <option>Admin</option>

                </select>

                <button
                    type="submit"
                    class="primary-btn login-btn">
                    Login
                </button>


                <p style="text-align:center;margin-top:15px;">
                    Don't have an account?
                    <a href="#" onclick="openRegister()">
                        Create Account
                    </a>
                </p>

            </form>
            <p id="message"></p>
        </div>
    </div>


    <!-- Paste the Register Modal here -->
    <div class="login-modal" id="registerModal">
        <div class="login-box">
            <span
                class="close-btn"
                style="display:none;">
                    ✕
            </span>

            <h2>SPARC Register</h2>
            <form id="registerForm">
                <label>Name</label>
                <input
                    type="text"
                    id="regName"
                    placeholder="Enter Name"
                    required>

                <label>Email</label>
                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter Email"
                    required>

                <label>Password</label>
                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create Password"
                    required>

                <label>Role</label>
                <select id="regRole">
                    <option value="Admin">Admin</option>
                    <option value="Volunteer">Volunteer</option>
                    <option value="NGO">NGO</option>
                    <option value="Donor">Donor</option>
                    <option value="Employer">Employer</option>
                </select>

                <button
                    type="submit"
                    class="primary-btn login-btn">
                    Register
                </button>
                <p id="registerMessage"></p>
            </form>
        </div>
    </div>

    <!-- Alert Popup -->
    <div id="alertModal" class="success-popup">
        <div class="success-popup-box">
            <div
                id="alertIcon"
                class="success-popup-icon">
                ✓
            </div>

            <h2 id="alertTitle">
                Success
            </h2>

            <p id="alertMessage">
            </p>

            <button onclick="closeAlert()">
                OK
            </button>
        </div>
    </div>

    <!-- Forgot Password -->
    <div id="forgotPasswordModal" class="login-modal">
        <div class="login-box">
            <h2>Reset Password</h2>

            <!-- STEP 1 -->
            <div id="forgotStep1">
                <label>Registered Email</label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter Registered Email">

                <button
                    id="sendOtpBtn"
                    class="primary-btn login-btn"
                    onclick="sendOTP()">
                    Send OTP
                </button>
            </div>

            <!-- STEP 2 -->
            <div id="forgotStep2" style="display:none;">
                <label>Enter OTP</label>

                <input
                    type="text"
                    id="forgotOTP"
                    placeholder="Enter OTP"
                    maxlength="6"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                    onkeypress="if(event.key==='Enter'){verifyOTP();}">

                <p
                    style="
                    text-align:center;
                    margin-top:8px;
                    font-size:13px;
                    color:#6b7280;
                ">
                OTP is valid for 10 minutes.
                </p>

                <button
                    class="primary-btn login-btn"
                    onclick="verifyOTP()">
                    Verify OTP
                </button>

                <br><br>

                <div id="otpTimer" style="text-align:center;">
                    <div
                        id="otpStatus"
                        style="color:var(--primary);font-weight:bold;margin-bottom:8px;">
                        📨 OTP sent successfully
                    </div>

                    <span
                        id="countdownText"
                        style="color:#666;font-weight:bold;">
                        Resend OTP in 01:00
                    </span>

                    <br><br>

                    <button
                        id="resendOtpBtn"
                        class="primary-btn login-btn"
                        style="display:none;"
                        onclick="resendOTP()">
                        Resend OTP
                    </button>
                </div>
            </div>

            <!-- STEP 3 -->
            <div id="forgotStep3" style="display:none;">
                <label>New Password</label>

                <input
                    type="password"
                    id="forgotNewPassword"
                    placeholder="Enter New Password">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="forgotConfirmPassword"
                    placeholder="Confirm Password"
                    onkeypress="if(event.key==='Enter'){resetPassword();}">

                <button
                    class="primary-btn login-btn"
                    onclick="resetPassword()">
                    Reset Password
                </button>
            </div>

            <br>

            <button
                class="primary-btn login-btn"
                style="background:#6b7280"
                onclick="closeForgotPassword()">
                Cancel
            </button>
        </div>
    </div>

    <!-- OTP Loading Popup -->
    <div id="loadingModal" class="success-popup">
        <div class="success-popup-box">
            <div class="loader-spinner"></div>

            <h2 id="loadingTitle">
                Secure Verification
            </h2>

            <div id="loadingSteps">
                <p id="step1">
                    🔒 Verifying registered email...
                </p>

                <p id="step2">
                    📨 Sending OTP securely...
                </p>

                <p id="step3">
                    ⏳ Please wait...
                </p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="Script.js"></script>

    <script>
        // Show login immediately
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("loginModal").style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded",()=>{
            openLogin();
        });
    </script>

</body>
</html>

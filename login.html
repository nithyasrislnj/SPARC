<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SPARC Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Paste the Login Modal here -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <span class="close-btn" style="display:none;">
                ✕
            </span>
            <h2>SPARC Login</h2>

            <form id="loginForm">
                <label>Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required
                >

                <label>Role</label>
                <select id="role">

                    <option>Volunteer</option>
                    <option>NGO</option>
                    <option>Donor</option>
                    <option>Employer</option>
                    <option>Admin</option>

                </select>

                <button
                    type="submit"
                    class="primary-btn login-btn">
                    Login
                </button>


                <p style="text-align:center;margin-top:15px;">
                    Don't have an account?
                    <a href="#" onclick="openRegister()">
                        Create Account
                    </a>
                </p>

            </form>
            <p id="message"></p>
        </div>
    </div>


    <!-- Paste the Register Modal here -->
    <div class="login-modal" id="registerModal">
        <div class="login-box">
            <span
                class="close-btn"
                style="display:none;">
                    ✕
            </span>

            <h2>SPARC Register</h2>
            <form id="registerForm">
                <label>Name</label>
                <input
                    type="text"
                    id="regName"
                    placeholder="Enter Name"
                    required>

                <label>Email</label>
                <input
                    type="email"
                    id="regEmail"
                    placeholder="Enter Email"
                    required>

                <label>Password</label>
                <input
                    type="password"
                    id="regPassword"
                    placeholder="Create Password"
                    required>

                <label>Role</label>
                <select id="regRole">
                    <option value="Admin">Admin</option>
                    <option value="Volunteer">Volunteer</option>
                    <option value="NGO">NGO</option>
                    <option value="Donor">Donor</option>
                    <option value="Employer">Employer</option>
                </select>

                <button
                    type="submit"
                    class="primary-btn login-btn">
                    Register
                </button>
                <p id="registerMessage"></p>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="Script.js"></script>

    <script>
        // Show login immediately
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("loginModal").style.display = "flex";
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded",()=>{
            openLogin();
        });
    </script>

</body>
</html>
